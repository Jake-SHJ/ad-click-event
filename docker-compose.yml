# 로컬 데모 환경. `make demo-up`으로 띄운다.
# 지금은 인프라만 있다. 앱 2개(collector, pipeline)와 web은 사용자 스토리 단계에서 추가한다.

name: ad-click-event

services:
  kafka:
    image: apache/kafka:4.2.2          # Spring Boot 4.1 BOM의 kafka-clients 버전과 맞춤
    ports:
      - "9092:9092"                    # 호스트(로컬 개발·테스트)용
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:29093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1   # Kafka Streams exactly_once_v2 에 필요
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"           # 토픽은 kafka-init 이 명시적으로 만든다
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 24

  kafka-init:
    image: apache/kafka:4.2.2
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]
    environment:
      BOOTSTRAP: kafka:29092
    volumes:
      - ./infra/kafka/create-topics.sh:/scripts/create-topics.sh:ro
    restart: "no"

  apicurio:
    image: apicurio/apicurio-registry:3.3.4   # 저장소: 인메모리(로컬 데모). 재시작 시 스키마는 앱이 다시 등록
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/apis/registry/v3/system/info > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 24

  apicurio-init:
    image: curlimages/curl:8.23.0
    depends_on:
      apicurio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/scripts/init-rules.sh"]
    environment:
      REGISTRY_URL: http://apicurio:8080
    volumes:
      - ./infra/apicurio/init-rules.sh:/scripts/init-rules.sh:ro
    restart: "no"

  postgres:
    image: postgres:18
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-adclick}
      POSTGRES_USER: ${POSTGRES_USER:-adclick}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-adclick}   # 로컬 데모 전용 값(.env.demo)
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adclick -d adclick"]
      interval: 5s
      timeout: 5s
      retries: 24

  prometheus:
    image: prom/prometheus:v3.16.0
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
      - --web.enable-lifecycle
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"   # IDE에서 직접 띄운 서비스도 수집하기 위해
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/ready > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 24

volumes:
  kafka-data:
  postgres-data:
