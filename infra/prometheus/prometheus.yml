# 앱의 /actuator/prometheus 를 1초마다 수집한다(시각화 SC-010: 5초 안 반영).
# compose 안의 서비스 이름으로 먼저 찾고, IDE에서 직접 띄운 경우를 위해 host.docker.internal 도 둔다.
# 단계(stage) 구분은 앱이 지표 레이블로 붙인다(pipeline 안의 ingest·realtime·finalize·query 모듈).
global:
  scrape_interval: 1s
  evaluation_interval: 1s

scrape_configs:
  - job_name: adclick
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["collector:8081", "pipeline:8082"]

  - job_name: adclick-host
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8081", "host.docker.internal:8082"]
